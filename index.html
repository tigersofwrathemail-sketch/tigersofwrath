<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="tigersofwrath — independent creative projects.">
<meta name="application-name" content="tigersofwrath">
<meta name="apple-mobile-web-app-title" content="tigersofwrath">
<meta property="og:site_name" content="tigersofwrath">
<meta property="og:title" content="tigersofwrath">
<meta property="og:type" content="website">
<title>tigersofwrath</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html { background: #fff; }
  body {
    margin: 0; min-height: 100vh; background: #fff; color: #111;
    font-family: Montserrat, "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }
  .site { width: 100%; max-width: 1450px; padding: 38px 44px 90px; margin: 0 auto; }
  .site.subpage { display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; padding-bottom: 28px; }
  .site.subpage main { flex: 1; min-height: 0; }
  .site-index { margin-top: auto; }
  .site-index .back { margin-top: 0; }
  .site.image-view .site-index { padding: 8px 44px 26px; }

  header { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; }
  .mark { display: inline-block; min-width: 0; }
  .mark img { display: block; width: clamp(180px, 23vw, 260px); max-width: 100%; height: clamp(53px, 7vw, 78px); object-fit: cover; object-position: center; }
  main { padding-top: 13px; }
  .document { max-width: 650px; }
  .site.image-view {
    max-width: none; padding: 0; min-height: 100vh; min-height: 100dvh;
  }
  .site.image-view header { display: none; }
  .site.image-view main { padding: 0; display: flex; flex-direction: column; }
  .project-image {
    width: 100%; min-height: 0; flex: 1;
    display: flex; justify-content: center; align-items: center;
    margin: 0; padding: 0; background: #fff;
  }
  .project-image img {
    display: block; width: auto; height: auto;
    max-width: 100%; max-height: calc(100vh - 64px); max-height: calc(100dvh - 64px);
    object-fit: contain;
  }
  .project-pdf {
    display: flex; flex-direction: column; flex: 1;
    width: 100%; min-height: 0; background: #fff;
  }
  .project-pdf iframe {
    width: 100%; height: calc(100vh - 64px); height: calc(100dvh - 64px);
    min-height: 350px; display: block; border: 0; background: #fff;
  }
  .pdf-open { margin-left: 26px; }
  .artifact {
    display: block; width: fit-content; max-width: 100%; color: inherit; text-decoration: none;
    padding: 3px 0; cursor: pointer; white-space: nowrap;
  }
  .artifact + .artifact { margin-top: 3px; }
  .artifact-poems { white-space: normal; }
  .artifact-poems .artifact-place { white-space: nowrap; }
  .artifact-name {
    display: inline; font-size: 14px; line-height: 1.38; font-weight: 400;
    letter-spacing: -.035em;
  }
  .artifact-dash { font-size: 11.5px; font-weight: 400; font-style: normal; }
  .artifact-place {
    display: inline; font-size: 11.5px; line-height: 1.6;
    letter-spacing: -.015em; font-weight: 300; font-style: italic;
  }
  .contact-link.back { display: block; width: fit-content; margin-top: 19px; }
  .artifact:hover .artifact-name, .artifact:focus-visible .artifact-name {
    text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px;
  }
  .artifact:focus-visible { outline: 1px solid #111; outline-offset: 5px; }
  .detail h1 {
    margin: 3px 0 2px; font-size: 14px; line-height: 1.38; letter-spacing: -.035em; font-weight: 500;
  }
  .detail .location {
    margin: 0; font-size: 11.5px; line-height: 1.6; font-weight: 300; font-style: italic;
  }
  .record { margin-top: 23px; max-width: 520px; }
  .record p { margin: 0 0 5px; font-size: 11.5px; line-height: 1.7; font-weight: 400; }
  .record strong { font-weight: 700; }
  .record em { font-weight: 300; font-style: italic; }
  .back { display: inline-block; margin-top: 29px; color: #111; font-size: 10px; font-weight: 500; text-underline-offset: 3px; }
  .visually-hidden {
    position: absolute; height: 1px; width: 1px; overflow: hidden;
    clip: rect(0, 0, 0, 0); white-space: nowrap;
  }
  [hidden] { display: none !important; }
  @media (max-width: 600px) {
    .site { padding: 28px 20px 75px; }
    .site.subpage { padding-bottom: 24px; }
    .site.image-view .site-index { padding: 8px 20px 24px; }
    .mark img { width: clamp(164px, 50vw, 218px); height: clamp(48px, 15vw, 65px); }
    main { padding-top: 9px; }
    .artifact-name { font-size: 13px; }
    .artifact-place, .detail .location, .record p { font-size: 11px; }
  }
</style>
</head>
<body>
<div class="site">
  <header>
    <a class="mark" href="#" aria-label="tigersofwrath — home">
      <img width="1536" height="1024" src="wordmark.PNG" alt="tigersofwrath">
    </a>
  </header>
  <main>
    <section class="document" data-page="home" aria-label="Projects">
      <h1 class="visually-hidden">Projects</h1>
      <a class="artifact artifact-poems" href="#poems" aria-label="THE ONLY THING THAT CARRIES WEIGHT, SELECTED POEMS, 2009 to 2019">
        <span class="artifact-name">THE ONLY THING THAT CARRIES WEIGHT</span> <span class="artifact-dash">—</span> <span class="artifact-place">SELECTED POEMS (2009–2019)</span>
      </a>
      <a class="artifact" href="#tarllc" aria-label="TARLLC, wine project, Vayots Dzor, Armenia (2015–2023)">
        <span class="artifact-name">TARLLC</span> <span class="artifact-dash">—</span> <span class="artifact-place">VAYOTS DZOR, ARMENIA (2015–2023)</span>
      </a>
      <a class="artifact" href="#niva" aria-label="LADA NIVA 21213, Vayots Dzor, Armenia (January 2022)">
        <span class="artifact-name">LADA NIVA 21213</span> <span class="artifact-dash">—</span> <span class="artifact-place">VAYOTS DZOR, ARMENIA (JANUARY 2022)</span>
      </a>
      <a class="contact-link back" href="#contact">Contact Us</a>
    </section>
    <section class="project-pdf" data-page="poems" aria-label="Selected poems PDF" hidden>
      <iframe src="The_Only_Thing_That_Carries_Weight.pdf" title="THE ONLY THING THAT CARRIES WEIGHT — SELECTED POEMS 2009–2019" loading="lazy"></iframe>
    </section>
    <section class="project-image" data-page="tarllc" aria-label="tarllc illustration" hidden>
      <img src="tarllc.PNG" alt="Abstract watercolor drawing of the old-vine vineyard in Vayots Dzor" width="1086" height="1448">
    </section>
    <section class="project-image" data-page="niva" aria-label="Lada Niva illustration" hidden>
      <img src="niva.PNG" alt="Abstract watercolor drawing of a white Lada Niva in the rocky Vayots Dzor landscape" width="1086" height="1448">
    </section>
    <section class="document detail" data-page="contact" hidden>
      <h1>Contact</h1>
      <div class="record"><p>Contact details to follow.</p></div>
    </section>
  </main>
  <footer class="site-index" data-index-footer hidden><a class="back" href="#">Index</a><a class="back pdf-open" href="The_Only_Thing_That_Carries_Weight.pdf" target="_blank" rel="noopener" data-pdf-open hidden>Open PDF</a></footer>
</div>
<script>
(() => {
  const show = () => {
    const fragment = location.hash.replace(/^#/, '');
    const current = fragment === 'contact' ? 'contact'
      : fragment === 'poems' ? 'poems'
      : (fragment === 'tarllc' || fragment === 'winemaking') ? 'tarllc'
      : fragment === 'niva' ? 'niva' : 'home';
    document.querySelectorAll('[data-page]').forEach(section => {
      section.hidden = section.dataset.page !== current;
    });
    document.querySelector('.site').classList.toggle('image-view', current === 'tarllc' || current === 'niva' || current === 'poems');
    document.querySelector('.site').classList.toggle('subpage', current !== 'home');
    document.querySelector('[data-index-footer]').hidden = current === 'home';
    document.querySelector('[data-pdf-open]').hidden = current !== 'poems';
    document.title = current === 'home' ? 'tigersofwrath'
      : current === 'poems' ? 'THE ONLY THING THAT CARRIES WEIGHT — tigersofwrath'
      : current === 'tarllc' ? 'tarllc — tigersofwrath'
      : current === 'niva' ? 'Lada Niva 21213 — tigersofwrath'
      : 'Contact — tigersofwrath';
    window.scrollTo(0, 0);
  };
  window.addEventListener('hashchange', show);
  show();

  // Align the first visible dark stroke of the uploaded wordmark with the
  // left edge of the portfolio entries, independent of the PNG's whitespace.
  const wordmark = document.querySelector('.mark img');
  const alignWordmark = () => {
    if (!wordmark.complete || !wordmark.naturalWidth) return;
    const rect = wordmark.getBoundingClientRect();
    const width = wordmark.clientWidth;
    const height = wordmark.clientHeight;
    if (!width || !height) return;

    try {
      const naturalWidth = wordmark.naturalWidth;
      const naturalHeight = wordmark.naturalHeight;
      const sampleWidth = Math.min(512, naturalWidth);
      const sampleHeight = Math.max(1, Math.round(sampleWidth * naturalHeight / naturalWidth));
      const canvas = document.createElement('canvas');
      canvas.width = sampleWidth;
      canvas.height = sampleHeight;
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      if (!ctx) return;
      ctx.drawImage(wordmark, 0, 0, sampleWidth, sampleHeight);
      const pixels = ctx.getImageData(0, 0, sampleWidth, sampleHeight).data;

      const scale = Math.max(width / naturalWidth, height / naturalHeight);
      const sourceLeft = (naturalWidth - width / scale) / 2;
      const sourceTop = (naturalHeight - height / scale) / 2;
      const sourceRight = sourceLeft + width / scale;
      const sourceBottom = sourceTop + height / scale;
      let minInkX = Infinity;
      for (let y = 0; y < sampleHeight; y++) {
        const sy = (y + 0.5) * naturalHeight / sampleHeight;
        if (sy < sourceTop || sy > sourceBottom) continue;
        for (let x = 0; x < sampleWidth; x++) {
          const sx = (x + 0.5) * naturalWidth / sampleWidth;
          if (sx < sourceLeft || sx > sourceRight || sx >= minInkX) continue;
          const i = (y * sampleWidth + x) * 4;
          const darkness = (pixels[i] + pixels[i + 1] + pixels[i + 2]) / 3;
          if (pixels[i + 3] > 100 && darkness < 155) minInkX = sx;
        }
      }
      if (Number.isFinite(minInkX)) {
        const inset = Math.max(0, (minInkX - sourceLeft) * scale);
        wordmark.style.transform = 'translateX(' + (-inset).toFixed(2) + 'px)';
      }
    } catch (e) {
      // Leave the unchanged wordmark visible if pixel sampling is unavailable.
      wordmark.style.transform = 'none';
    }
  };
  wordmark.addEventListener('load', alignWordmark);
  window.addEventListener('resize', alignWordmark);
  if (wordmark.complete) alignWordmark();
})();
</script>
</body>
</html>
